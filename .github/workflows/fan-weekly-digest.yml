name: Fan Weekly Digest

# Weekly performance digest for contestants and their fans.
#
# This runs HOURLY and sends nothing most of the time. That is deliberate: each
# competition sends at 10 AM in ITS OWN timezone, so there is no single UTC hour
# that serves a competition in Vancouver and one in Toronto. The workflow's only
# job is to ask "who is due right now?" once an hour; send-fan-weekly-digest
# answers from each competition's local clock and its fan_digest_sends ledger.
#
# Exactly-once delivery therefore lives in the DATABASE, not in this cron. That
# is what makes an hourly poll safe, and it also fixes the failure this file
# used to have: it ran on two fixed Friday ticks gated by a wall-clock check, so
# when GitHub delayed both ticks ~9 hours on 2026-08-28 the check failed twice
# and nobody got a digest that week — while the workflow still reported success.
# A delayed hourly tick now just sends late, because the ledger, not the clock,
# decides what has already gone out.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build the recipient list but do not send)'
        type: boolean
        default: false
      competition_id:
        description: 'Optional: send for this competition only, ignoring the schedule'
        type: string
        required: false

# Two overlapping runs could both claim the same competition-week. The ledger's
# unique constraint is the backstop, but not overlapping is cheaper than
# relying on it. Never cancel-in-progress: that would kill a run mid-send.
concurrency:
  group: fan-weekly-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Invoke send-fan-weekly-digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          COMPETITION_ID: ${{ inputs.competition_id || '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret."
            exit 1
          fi

          ENDPOINT="${SUPABASE_URL%/}/functions/v1/send-fan-weekly-digest"
          # The function stops before the edge runtime's wall-clock limit and
          # reports summary.resume; keep invoking until it says it is finished.
          MAX_CHUNKS=12
          TOTAL_SENT=0
          TOTAL_SKIPPED=0
          TOTAL_FAILED=0
          TOTAL_DUE=0
          FINISHED=false
          LEDGER=unknown

          for chunk in $(seq 1 "$MAX_CHUNKS"); do
            if [ -n "${COMPETITION_ID:-}" ]; then
              BODY=$(jq -n --argjson d "$DRY_RUN" --arg c "$COMPETITION_ID" '{dry_run: $d, competition_id: $c}')
            else
              BODY=$(jq -n --argjson d "$DRY_RUN" '{dry_run: $d}')
            fi
            echo "POST $ENDPOINT  body=$BODY"
            # Capture status and body separately so the body is always visible,
            # even on 5xx. Using --fail-with-body inside $() swallows the body
            # under `set -e`, which is why prior failed runs only showed "exit 22".
            HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "$ENDPOINT")
            echo "HTTP $HTTP_CODE"
            jq '{summary, competitions}' /tmp/resp.json || cat /tmp/resp.json

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Edge function returned HTTP $HTTP_CODE"
              cat /tmp/resp.json
              exit 1
            fi
            jq -e '.success == true' /tmp/resp.json > /dev/null

            TOTAL_SENT=$((TOTAL_SENT + $(jq -r '.summary.sent // 0' /tmp/resp.json)))
            TOTAL_SKIPPED=$((TOTAL_SKIPPED + $(jq -r '.summary.skipped // 0' /tmp/resp.json)))
            TOTAL_FAILED=$((TOTAL_FAILED + $(jq -r '.summary.failed // 0' /tmp/resp.json)))
            TOTAL_DUE=$(jq -r '.summary.competitions_due // 0' /tmp/resp.json)
            LEDGER=$(jq -r '.ledger_available // "unknown"' /tmp/resp.json)

            if [ "$(jq -r '.summary.resume // false' /tmp/resp.json)" != "true" ]; then
              FINISHED=true
              break
            fi
            echo "Time budget reached with work outstanding — invoking again."
          done

          # Nothing due is the normal case for 167 of every 168 ticks. Say so
          # briefly and leave the step summary empty rather than posting an
          # hourly wall of "0 sent" noise.
          if [ "$TOTAL_DUE" = "0" ]; then
            echo "No competitions due this hour."
            exit 0
          fi

          ATTEMPTED=$((TOTAL_SENT + TOTAL_FAILED))
          {
            echo "## Fan weekly digest"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Competitions due | $TOTAL_DUE |"
            echo "| Sent | $TOTAL_SENT |"
            echo "| Skipped (no email on file) | $TOTAL_SKIPPED |"
            echo "| Failed | $TOTAL_FAILED |"
            echo "| Schedule ledger | $LEDGER |"
            echo ""
            jq -r '.competitions[]? | "- **\(.name // .competition_id)** (\(.timezone // "?")): \(.status) — sent \(.sent // 0), failed \(.failed // 0)"' /tmp/resp.json || true
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LEDGER" = "false" ]; then
            echo "::warning::fan_digest_sends is missing — running without the catch-up window. Apply migration 20260830000000_126_fan_digest_schedule.sql."
          fi

          if [ "$FINISHED" != "true" ]; then
            echo "::error::Still had work outstanding after $MAX_CHUNKS invocations."
            exit 1
          fi

          # A stray bounce should not fail the job, but a systemic failure must:
          # rate limiting silently ate 308 of 368 sends on 2026-08-21 while the
          # workflow reported success. Fail past 10% of attempted sends.
          if [ "$TOTAL_FAILED" -gt 0 ]; then
            echo "::warning::$TOTAL_FAILED of $ATTEMPTED digest emails failed."
            if [ "$((TOTAL_FAILED * 10))" -gt "$ATTEMPTED" ]; then
              echo "::error::Failure rate above 10% ($TOTAL_FAILED/$ATTEMPTED) — digest delivery is broken."
              exit 1
            fi
          fi
